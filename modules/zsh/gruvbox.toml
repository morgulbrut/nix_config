# Flat, non-powerline gruvbox-accented prompt: plain colored text, no
# background blocks, no arrow separators, no Nerd Font icon dependency.
# color_host is a placeholder substituted per-host by modules/zsh/home.nix
# (so the prompt is visually distinct per machine) -- see that file for the
# host -> color mapping.
"$schema" = 'https://starship.rs/config-schema.json'

palette = 'gruvbox_dark'

[palettes.gruvbox_dark]
color_fg0 = '#fbf1c7'
color_host = '@@HOST_ACCENT@@'
color_blue = '#458588'
color_aqua = '#689d6a'
color_green = '#98971a'
color_purple = '#b16286'
color_red = '#cc241d'
color_yellow = '#d79921'

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$c$cpp$rust$golang$nodejs$bun$php$java$kotlin$haskell$python\
$docker_context$conda$pixi\
$time\
$line_break$character"""

[username]
show_always = true
style_user = "bold fg:color_fg0"
style_root = "bold fg:color_red"
format = '[$user]($style)'

[hostname]
ssh_only = false
style = "bold fg:color_host"
format = '[@$hostname]($style) '

[directory]
style = "fg:color_yellow"
format = "[$path]($style) "
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
style = "fg:color_aqua"
format = '[on $branch]($style) '

[git_status]
style = "fg:color_aqua"
format = '[$all_status$ahead_behind]($style) '

[nodejs]
style = "fg:color_blue"
format = '[node $version]($style) '

[bun]
style = "fg:color_blue"
format = '[bun $version]($style) '

[c]
style = "fg:color_blue"
format = '[c $version]($style) '

[cpp]
style = "fg:color_blue"
format = '[c++ $version]($style) '

[rust]
style = "fg:color_blue"
format = '[rust $version]($style) '

[golang]
style = "fg:color_blue"
format = '[go $version]($style) '

[php]
style = "fg:color_blue"
format = '[php $version]($style) '

[java]
style = "fg:color_blue"
format = '[java $version]($style) '

[kotlin]
style = "fg:color_blue"
format = '[kotlin $version]($style) '

[haskell]
style = "fg:color_blue"
format = '[haskell $version]($style) '

[python]
style = "fg:color_blue"
format = '[python $version]($style) '

[docker_context]
style = "fg:color_fg0"
format = '[docker $context]($style) '

[conda]
style = "fg:color_fg0"
format = '[conda $environment]($style) '

[pixi]
style = "fg:color_fg0"
format = '[pixi $version( $environment)]($style) '

[time]
disabled = false
time_format = "%R"
style = "fg:color_fg0"
format = '[$time]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[❯](bold fg:color_green)'
error_symbol = '[❯](bold fg:color_red)'
vimcmd_symbol = '[❮](bold fg:color_green)'
vimcmd_replace_one_symbol = '[❮](bold fg:color_purple)'
vimcmd_replace_symbol = '[❮](bold fg:color_purple)'
vimcmd_visual_symbol = '[❮](bold fg:color_yellow)'
